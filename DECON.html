<script>
document.querySelectorAll(".carousel-D").forEach((carousel) => {
  const track = carousel.querySelector(".slides-D");
  const images = track.querySelectorAll("img");
const caption = carousel.parentElement.querySelector(".carousel-caption");
  let index = 0;

  const captions = [
    "2025",
    "2024",
    "2025",
    "2023"
  ];

function update() {
  track.style.transform = `translateX(-${index * 100}%)`;

  if (caption) {
    caption.style.opacity = 0;
    caption.style.transform = "translateY(6px)";

    setTimeout(() => {
      caption.textContent = captions[index];
      caption.style.opacity = 1;
      caption.style.transform = "translateY(0)";
    }, 120);
  }
}

  carousel.querySelector(".next").addEventListener("click", () => {
    index = (index + 1) % images.length;
    update();
  });

  carousel.querySelector(".prev").addEventListener("click", () => {
    index = (index - 1 + images.length) % images.length;
    update();
  });

  update();
});
</script>
